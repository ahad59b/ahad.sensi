<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ahad Sensi</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#070b12;
  color:#fff;
  font-family:Arial,sans-serif;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.header{
  padding:12px 0 20px;
  font-size:25px;
  font-weight:800;
}

.card{
  background:#101827;
  border:1px solid #26344b;
  border-radius:20px;
  padding:22px;
}

.logo{
  width:72px;
  height:72px;
  border-radius:18px;
  background:#243452;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:bold;
  margin-bottom:18px;
}

h1{
  margin:0 0 8px;
  font-size:28px;
}

.description{
  color:#9eabc0;
  font-size:14px;
}

.price{
  font-size:25px;
  font-weight:bold;
  margin:20px 0;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  background:#2979ff;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

.status{
  margin-top:15px;
  padding:13px;
  border-radius:12px;
  background:#182338;
  color:#b9c5d8;
  font-size:13px;
}

.success{
  background:#123d27;
  color:#83ffb1;
}

.error{
  background:#451d1d;
  color:#ffb1a8;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    Ahad Sensi
  </div>

  <div class="card">

    <div class="logo">A</div>

    <h1>Ahad Sensi</h1>

    <div class="description">
      Premium APK
    </div>

    <div class="price">
      ৳10
    </div>

    <button id="payBtn" onclick="payNow()">
      Pay ৳10 with RupantorPay
    </button>

    <div id="status" class="status hidden"></div>

  </div>

</div>

<script>

/* ==============================
   RUPANTORPAY PAYMENT LINK
   ============================== */

const RUPANTORPAY_PAYMENT_LINK =
"https://rupantorpay.com/paymentlink/eyJ1aWQiOjYyNjcsImJyYW5kX2lkIjoiMzg5NSIsImN1c3RvbWVyX2Ftb3VudCI6IjEwIn0";


/* ==============================
   APK DESTINATION
   ============================== */

const APK_URL =
"https://www.mediafire.com/file/nbn4ms5bvkp5cf2/ahad.sensi+v1.apk/file";


function payNow(){

    document.getElementById("payBtn").disabled = true;

    window.location.href =
        RUPANTORPAY_PAYMENT_LINK;
}


/* ==============================
   RUPANTORPAY RETURN CHECK
   ============================== */

function checkPaymentReturn(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const transactionId =
        params.get("transactionId");

    const status =
        (params.get("status") || "")
        .toUpperCase();

    const amount =
        params.get("paymentAmount");

    const statusBox =
        document.getElementById("status");


    /*
      This checks the return parameters only.
      It is NOT server-side API verification.
    */

    if(
        transactionId &&
        status === "COMPLETED" &&
        amount === "10"
    ){

        statusBox.className =
            "status success";

        statusBox.textContent =
            "Payment completed. Download খুলছে...";

        statusBox.classList.remove(
            "hidden"
        );


        setTimeout(function(){

            window.location.href =
                APK_URL;

        },700);

    }

    else if(
        transactionId &&
        status
    ){

        statusBox.className =
            "status error";

        statusBox.textContent =
            "Payment verified হয়নি। Status: " +
            status;

        statusBox.classList.remove(
            "hidden"
        );
    }
}


/* Check when RupantorPay returns */
checkPaymentReturn();

</script>

</body>
</html>
