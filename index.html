<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahad Sensi</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#070b12;
  color:#fff;
  font-family:Arial,sans-serif;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.header{
  padding:12px 0 20px;
  font-size:25px;
  font-weight:bold;
}

.card{
  background:#101827;
  border:1px solid #26344b;
  border-radius:20px;
  padding:22px;
  margin-top:15px;
  text-align:center;
}

.logo{
  width:70px;
  height:70px;
  border-radius:18px;
  background:#243452;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:bold;
  margin:0 auto 18px;
}

.description{
  color:#9eabc0;
  font-size:14px;
  line-height:1.6;
}

.price{
  font-size:25px;
  font-weight:bold;
  margin:20px 0;
}

button,.download{
  display:block;
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  background:#2979ff;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
}

button:disabled {
  background:#555;
  cursor:not-allowed;
}

.info{
  margin-top:15px;
  padding:13px;
  background:#182338;
  border-radius:11px;
  color:#9eabc0;
  font-size:12px;
}

.success{
  color:#00c853;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
Ahad Sensi
</div>

<div class="card" id="card">

<div class="logo">A</div>

<h1>Ahad Sensi</h1>

<div class="description">
Premium APK
</div>

<div class="price">
৳15
</div>

<button id="payBtn" onclick="payNow()">
Pay ৳15 with RupantorPay
</button>

<div class="info">
Payment করার পর সফল হলে automatic download হবে।
</div>

</div>

</div>

<script>
// ==================== [ API সেটিং ] ====================
// ১. আপনার API Key এখানে বসাবেন
const API_KEY = "hf6Xp7wd7P1nuYmXDLDkHJCPBMusZRGoNCLVzrfE3yCtSyPpL4"; 

// ২. ডাউনলোডের মিডিয়া ফায়ার লিঙ্ক
const APK_LINK = "https://www.mediafire.com/file/nbn4ms5bvkp5cf2/ahad.sensi_v1.apk/file";

// ৩. RupantorPay API এ্যান্ডপয়েন্ট URL
const API_CREATE_URL = "https://rupantorpay.com/api/create-payment";
// =========================================================

async function payNow() {
  const payBtn = document.getElementById("payBtn");
  payBtn.disabled = true;
  payBtn.innerText = "Processing...";

  try {
    // API দিয়ে পেমেন্ট রিকোয়েস্ট তৈরি করা হচ্ছে
    const response = await fetch(API_CREATE_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${API_KEY}` // API Key হেডারে পাঠানো হচ্ছে
      },
      body: JSON.stringify({
        apiKey: API_KEY, // অনেক গেটওয়ে Body-তেও API Key চায়
        amount: 15,
        currency: "BDT",
        success_url: window.location.origin + window.location.pathname + "?status=completed",
        cancel_url: window.location.origin + window.location.pathname + "?status=cancelled"
      })
    });

    const data = await response.json();

    // API থেকে পেমেন্ট ইউআরএল (Payment URL) আসলে রিডাইরেক্ট করবে
    if (data && (data.payment_url || data.url)) {
      window.location.href = data.payment_url || data.url;
    } else {
      alert("পেমেন্ট লিঙ্ক তৈরি করা সম্ভব হয়নি! API Key চেক করুন।");
      payBtn.disabled = false;
      payBtn.innerText = "Pay ৳15 with RupantorPay";
    }

  } catch (error) {
    console.error("API Error:", error);
    alert("API সার্ভারে যোগাযোগ করতে সমস্যা হয়েছে!");
    payBtn.disabled = false;
    payBtn.innerText = "Pay ৳15 with RupantorPay";
  }
}

// পেমেন্ট শেষে ইউজার পেজে ফিরে এলে চেক করা
window.addEventListener("DOMContentLoaded", function() {
  const params = new URLSearchParams(window.location.search);
  const transactionId = params.get("transactionId") || params.get("transaction_id") || params.get("trx_id");
  const status = (params.get("status") || "").toLowerCase();

  // পেমেন্ট সফল হলে
  if (status === "completed" || status === "success") {
    document.getElementById("card").innerHTML = `
      <div class="logo" style="background:#00c853">✓</div>
      <h1 class="success">Payment Successful!</h1>
      <div class="description">
        ${transactionId ? `Transaction ID: <br><b>${escapeHTML(transactionId)}</b><br><br>` : ''}
        Payment completed.<br>
        ২ সেকেন্ড পর Download শুরু হচ্ছে...
      </div>
    `;

    setTimeout(function() {
      window.location.href = APK_LINK;
    }, 2000);
  } 
  // পেমেন্ট ব্যর্থ বা ক্যানসেল হলে
  else if (status === "failed" || status === "cancelled") {
    document.getElementById("card").innerHTML = `
      <div class="logo" style="background:#ff3b30">✕</div>
      <h1 style="color:#ff3b30">Payment Failed!</h1>
      <div class="description">
        আপনার পেমেন্টটি সম্পন্ন হয়নি। দয়া করে আবার চেষ্টা করুন।
      </div>
      <br>
      <button onclick="window.location.href=window.location.pathname">আবার চেষ্টা করুন</button>
    `;
  }
});

function escapeHTML(text) {
  return text.replace(/[&<>"']/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[char];
  });
}
</script>

</body>
</html>
