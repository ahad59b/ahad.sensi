<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahad Sensi</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#070b12;
  color:#fff;
  font-family:Arial,sans-serif;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.header{
  padding:12px 0 20px;
  font-size:25px;
  font-weight:bold;
}

.card{
  background:#101827;
  border:1px solid #26344b;
  border-radius:20px;
  padding:22px;
  margin-top:15px;
}

.logo{
  width:70px;
  height:70px;
  border-radius:18px;
  background:#243452;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:bold;
  margin-bottom:18px;
}

h1{
  margin:0 0 8px;
  font-size:28px;
}

.description{
  color:#9eabc0;
  font-size:14px;
}

.price{
  font-size:25px;
  font-weight:bold;
  margin:20px 0;
}

button,.download-btn{
  display:block;
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  background:#2979ff;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.info{
  margin-top:15px;
  padding:13px;
  background:#182338;
  border-radius:11px;
  color:#9eabc0;
  font-size:12px;
  line-height:1.5;
}

.message{
  margin-top:15px;
  padding:13px;
  border-radius:11px;
  display:none;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    Ahad Sensi
  </div>

  <div class="card" id="mainCard">

    <div class="logo">A</div>

    <h1>Ahad Sensi</h1>

    <div class="description">
      Premium APK
    </div>

    <div class="price">
      ৳10
    </div>

    <button id="payButton" onclick="payNow()">
      Pay ৳10 with RupantorPay
    </button>

    <div class="info">
      পেমেন্ট সম্পন্ন করার পর RupantorPay থেকে
      payment verify করা হবে।
    </div>

    <div id="message" class="message"></div>

  </div>

</div>

<script>

/*
==================================================
              AHAD SENSI CONFIG
==================================================

IMPORTANT:
এখানে কোনো RupantorPay API key রাখবে না।

Cloudflare Worker তৈরি করার পর শুধু নিচের
BACKEND_URL পরিবর্তন করবে।
*/

// RupantorPay payment link
const PAYMENT_LINK =
"https://rupantorpay.com/paymentlink/eyJ1aWQiOjYyNjcsImJyYW5kX2lkIjoiMzg5OSIsImN1c3RvbWVyX2Ftb3VudCI6IjE1In0";

// পরে Cloudflare Worker URL এখানে বসাবি
const BACKEND_URL =
"https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev";

// APK download link
const APK_DOWNLOAD_LINK =
"https://www.mediafire.com/file/nbn4ms5bvkp5cf2/ahad.sensi_v1.apk/file";


function payNow(){

  /*
    Payment verification backend ছাড়া
    সরাসরি APK unlock করা হবে না।
  */

  if(BACKEND_URL.includes("YOUR-WORKER-NAME")){

    showMessage(
      "Payment system এখনো setup করা হয়নি। আগে backend setup করতে হবে।",
      "error"
    );

    return;
  }

  window.location.href = PAYMENT_LINK;
}


/*
==================================================
          PAYMENT VERIFICATION
==================================================
*/

async function verifyPayment(transactionId){

  try{

    const response = await fetch(
      BACKEND_URL + "/verify?transaction_id=" +
      encodeURIComponent(transactionId)
    );

    if(!response.ok){
      throw new Error("Verification failed");
    }

    const data = await response.json();

    /*
      Backend শুধুমাত্র verified payment হলে
      verified:true পাঠাবে।
    */

    if(data.verified === true){

      showSuccess();

    }else{

      showMessage(
        "Payment verify হয়নি। Download করা যাবে না।",
        "error"
      );

    }

  }catch(error){

    console.error(error);

    showMessage(
      "Payment verification করা যায়নি। কিছুক্ষণ পরে আবার চেষ্টা কর।",
      "error"
    );
  }
}


/*
==================================================
              SUCCESS SCREEN
==================================================
*/

function showSuccess(){

  const card = document.getElementById("mainCard");

  card.innerHTML = `

    <div class="logo"
         style="background:#00c853;">
      ✓
    </div>

    <h1 style="color:#00c853;">
      Payment Successful!
    </h1>

    <div class="description"
         style="margin-bottom:20px;">
      আপনার payment successfully verified হয়েছে।
    </div>

    <a
      href="${APK_DOWNLOAD_LINK}"
      class="download-btn"
      style="background:#00c853;">
      Download APK
    </a>

  `;
}


/*
==================================================
                MESSAGE
==================================================
*/

function showMessage(text,type){

  const message =
    document.getElementById("message");

  message.style.display = "block";
  message.textContent = text;

  if(type === "error"){
    message.style.background = "#3b1820";
    message.style.color = "#ff8a9b";
  }else{
    message.style.background = "#173b29";
    message.style.color = "#7dffad";
  }
}


/*
==================================================
        RETURN FROM PAYMENT PAGE
==================================================
*/

window.addEventListener("DOMContentLoaded",()=>{

  const params =
    new URLSearchParams(window.location.search);

  /*
    RupantorPay success URL থেকে transactionId
    পাওয়া গেলে backend-এ verification পাঠানো হবে।
  */

  const transactionId =
    params.get("transactionId") ||
    params.get("transaction_id");

  /*
    IMPORTANT:
    শুধু status=success দেখে payment successful
    ধরা হচ্ছে না।
  */

  if(transactionId){

    document.getElementById("payButton").disabled = true;

    showMessage(
      "Payment verify করা হচ্ছে...",
      "success"
    );

    verifyPayment(transactionId);
  }

});

</script>

</body>
</html>
